<!doctype html><html lang="ko"><meta charset="utf-8"><title>원본 기준 리깅 인형 검토</title>
<style>body{margin:0;background:#19262c;color:#eee;font:15px system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px}button{padding:10px;color:#eee;background:#2e4149;border:1px solid #80949a;border-radius:4px;cursor:pointer}button:focus-visible{outline:3px solid #e3cb8c}main{display:grid;grid-template-columns:minmax(160px,24%) 1fr;height:calc(100vh - 160px)}img{max-width:100%;max-height:100%;object-fit:contain}canvas{width:100%;height:100%;display:block;min-width:0}p,output{display:block;margin:6px 12px}p{color:#c6cdd0}@media(max-width:600px){main{grid-template-columns:28% 1fr}nav{gap:4px}button{padding:7px}}</style>
<nav><button data-view="front">정면</button><button data-view="angle">사선</button><button data-view="side">측면</button><button data-view="back">뒤</button><button data-view="face">얼굴 확대</button><button data-view="lying">누운 자세</button><button data-clip="rest">정지</button><button data-clip="GentleIdle">작은 고개 동작</button><button data-clip="JointInspection">팔 관절 확인</button><button id="school" aria-pressed="false">학교 조명</button></nav>
<p>왼쪽: 보존된 원본. 오른쪽: 별도 3D·리깅 후보. 원본 머리·정면 사진을 재사용하며 옆/뒤·의상은 근사입니다. 일반 게임 적용 전 외형 검토가 필요합니다.</p><output id="status" aria-live="polite">모델 로딩 중…</output><main><img src="../../assets/doll-student-concept.png" alt="채택된 원본 금발 인형"><canvas aria-label="원본 기준 리깅 모델 비교"></canvas></main>
<script type="module">
import * as THREE from '../../vendor/three.module.js';
import {loadCharacterAsset,instantiateCharacter,REFERENCE_STUDENT_URL} from '../../character-assets.js?v=quality-6';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#26363b');const ambient=new THREE.HemisphereLight('#c9d9e0','#786958',1.7);scene.add(ambient);
const key=new THREE.DirectionalLight('#f0e4cf',2.7);key.position.set(-2,4,-3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2});key.shadow.normalBias=.008;scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:'#686157',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);scene.add(new THREE.GridHelper(6,30,'#9a9890','#76796e'));
const camera=new THREE.PerspectiveCamera(38,1,.015,30),pose=new THREE.Group();scene.add(pose);let school=false,last=0;
try{const asset=await loadCharacterAsset(REFERENCE_STUDENT_URL),instance=instantiateCharacter(asset),model=instance.model;pose.add(model);
let bones=0,skins=0,triangles=0;model.traverse(o=>{if(o.isBone)bones++;if(o.isSkinnedMesh)skins++;if(o.isMesh)triangles+=o.geometry.index.count/3;});
canvas.dataset.status='ready';canvas.dataset.bones=bones;canvas.dataset.clips=asset.animations.length;canvas.dataset.skins=skins;canvas.dataset.triangles=triangles;
const views={front:[[0,.90,-3.1],[0,.78,0]],angle:[[1.8,1,-2.6],[0,.78,0]],side:[[3,1,0],[0,.78,0]],back:[[0,1,3.1],[0,.78,0]],face:[[.04,1.38,-.87],[0,1.30,-.10]],lying:[[1.5,1.3,-1.5],[0,.17,.78]]};
function view(id){instance.inspectionPose(id==='lying'?'lying':'standing');canvas.dataset.clip='rest';pose.rotation.x=id==='lying'?Math.PI/2:0;pose.position.y=id==='lying'?model.userData.floorHeight:0;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);canvas.dataset.view=id;}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);for(const b of document.querySelectorAll('[data-clip]'))b.onclick=()=>{instance.play(b.dataset.clip);canvas.dataset.clip=b.dataset.clip;};
document.querySelector('#school').onclick=e=>{school=!school;ambient.intensity=school?.28:1.7;key.intensity=school?.85:2.7;renderer.toneMappingExposure=school?.76:1.1;e.currentTarget.setAttribute('aria-pressed',String(school));};
new ResizeObserver(()=>{renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();}).observe(canvas);view('front');canvas.dataset.clip='rest';
function frame(t){instance.update((t-last)/1000);last=t;renderer.render(scene,camera);for(const [key,name] of [['headAngle','doll_head'],['armAngle','doll_upperarm_left']])canvas.dataset[key]=model.getObjectByName(name).quaternion.angleTo(new THREE.Quaternion()).toFixed(4);document.querySelector('#status').textContent=`검토 후보 · 뼈 ${bones} / 스킨 ${skins} / 동작 ${asset.animations.length} · ${canvas.dataset.view} / ${canvas.dataset.clip} · ${triangles.toLocaleString()} triangles · ${school?'학교':'밝은 검토'} 조명`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){document.querySelector('#status').textContent='모델 확인 실패: '+e.message;canvas.dataset.status='failed';console.error(e);}
</script></html>
