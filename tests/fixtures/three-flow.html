<!doctype html><html lang="ko"><meta charset="utf-8"><title>3D 탐색 흐름 검증</title><body><p>검증 게임 준비 중…</p><script type="module">
// Current real survival UI/controller; compat optionally forces Canvas fallback.
const html=await fetch('../../index.html',{cache:'no-store'}).then(r=>r.text());const page=new DOMParser().parseFromString(html,'text/html');page.querySelector('script[src^="game.js"]').remove();
document.head.innerHTML='<base href="/">'+page.head.innerHTML;document.title='3D 탐색 흐름 검증';document.body.innerHTML=page.body.innerHTML;document.body.dataset.screen=page.body.dataset.screen;
// Background preview hosts may not grant native focus. This opt-in test clock
// only bypasses document focus/visibility gating; pause and real game input
// still use the ordinary controller. Never enabled by the general game.
if(new URLSearchParams(location.search).has('activeClock')){
 document.hasFocus=()=>true;Object.defineProperty(document,'hidden',{get:()=>false});
 window.addEventListener('blur',e=>e.stopImmediatePropagation(),{capture:true});
 document.body.dataset.testClock='active';
}
if(new URLSearchParams(location.search).has('compat')){const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:original.call(this,type,...args);};}
// A failed optional character asset must never prevent entering/restarting.
if(new URLSearchParams(location.search).has('modelFail')){const fetchAsset=window.fetch;window.fetch=(url,...args)=>String(url instanceof Request?url.url:url).includes('student-doll.glb')?Promise.reject(new Error('Intentional model failure')):fetchAsset(url,...args);}
if(new URLSearchParams(location.search).get('model')==='glb'||new URLSearchParams(location.search).has('modelFail'))document.querySelector('#corridor').dataset.studentModelPreview='true';
// Exercise the real controller/audio graph without emitting sound on the user's
// device. The analyser remains upstream so PCM activity is still measurable.
if(new URLSearchParams(location.search).has('silent')){
 const Audio=window.AudioContext||window.webkitAudioContext,create=Audio.prototype.createAnalyser;
 Audio.prototype.createAnalyser=function(){
  const analyser=create.call(this),connect=analyser.connect.bind(analyser),sink=this.createGain();sink.gain.value=0;
  analyser.connect=destination=>{connect(sink);sink.connect(destination);return destination;};return analyser;
 };
}
if(new URLSearchParams(location.search).has('facelessFail')){
 const src=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');
 Object.defineProperty(HTMLImageElement.prototype,'src',{...src,set(value){src.set.call(this,String(value).includes('faceless-student.png')?'/assets/intentional-missing-student.png':value);}});
}
await import('../../game.js?v=shadow-tone-1');
// Preserve the first sound-clock draw and force the following exploration draw.
// Then restore random before Three.js creates UUIDs or audio creates noise.
// Capturing the real start/retry click runs before the ordinary game handler.
if(new URLSearchParams(location.search).has('safe'))for(const id of ['start','retry','again'])document.getElementById(id).addEventListener('click',()=>{
 const random=Math.random;let draws=0;Math.random=()=>{if(++draws===2){Math.random=random;return .99;}return random();};
},{capture:true});
</script></body></html>
