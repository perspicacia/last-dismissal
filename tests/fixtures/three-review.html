<!doctype html><html lang="ko"><meta charset="utf-8"><title>3D 학교 검증</title><style>body{margin:0;background:#0b151a;color:#d9e1d5;font:14px sans-serif}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{background:#263c3e;color:#dde8dc;border:1px solid #637a70;padding:8px}canvas{width:100%;height:82vh;display:block}</style><nav id="views"></nav><canvas id="view" data-renderer="three"></canvas><script type="module">
import {newDollState} from '../../doll-event.js';
import {Corridor} from '../../corridor.js?v=doll-sidewalls-5';
const c=new Corridor(document.getElementById('view'),()=>{},()=>{});c.tutorial=false;c.attackerKind='rabbit';
const presets=[['교실 인형',null,'classroom',{x:-.4,z:4,angle:-.36}],['인형 얼굴 근접',null,'classroom',{x:-.9,z:4.75,angle:0}],['학교 가구',null,'classroom',{x:-.8,z:2.1,angle:1.2},true],['가구 뒤쪽',null,'classroom',{x:0,z:5.8,angle:2.0}],['인형 측면 근접',null,'classroom',{x:0,z:4.9,angle:-.95}],['인형 옆모습',null,'classroom',{x:1,z:5.3,angle:-1.36}],['인형 기립','doll','classroom',{x:-.4,z:4,angle:-.36}],['실내 출입문',null,'classroom',{x:0,z:3,angle:Math.PI}],['교실 문',null,'corridor',{x:1.9,z:5,angle:-Math.PI/2}],['문 손자국','doll','corridor',{x:1.9,z:5,angle:-Math.PI/2}],['복도',null,'corridor',{x:0,z:1.8,angle:0}],['숲',null,'corridor',{x:1,z:6.5,angle:Math.PI/2}],['창밖 귀신','window','corridor',{x:1,z:6.5,angle:Math.PI/2}],['교실',null,'classroom',{x:0,z:4.9,angle:-Math.PI/2}],['계단 벽 틈',null,'corridor',{x:1.45,z:23.98,angle:-.35}],['상행 벽',null,'corridor',{x:-1.45,z:23.98,angle:.35}],['근거리 계단',null,'corridor',{x:-1.6,z:23.6,angle:0}],['아래층',null,'corridor',{x:1.6,z:23.6,angle:0}],['시계',null,'corridor',{x:-.5,z:19,angle:Math.PI/2}],['시계 이상','clock','corridor',{x:-.5,z:19,angle:Math.PI/2}],['문 이상','door','corridor',{x:1.9,z:5,angle:-Math.PI/2}],['사진',null,'corridor',{x:-.3,z:9,angle:-Math.PI/2}],['사진 이상','board','corridor',{x:-.3,z:9,angle:-Math.PI/2}],['토끼 이빨','figure','corridor',{x:1.6,z:13,angle:0}]];
function show(p){c.setActive(false);c.dollState=newDollState();c.anomaly=p[1];c.scene=p[2];c.player=p[3];c.mouthOpen=p[0]==='토끼 이빨';c.buildTextures();if(c.view3D){c.view3D.dollLook=undefined;c.view3D.lastViewTime=undefined;}c.draw(0);if(p[4]&&c.view3D){const v=c.view3D;v.camera.position.y=.95;v.camera.lookAt(c.player.x+Math.sin(c.player.angle),.62,-c.player.z-Math.cos(c.player.angle));v.renderer.render(v.scenes[c.scene],v.camera);}document.body.dataset.scene=p[0];if(p[0]==='인형 기립')c.setActive(true);}
for(const preset of presets){const b=document.createElement('button');b.textContent=preset[0];b.onclick=()=>show(preset);document.getElementById('views').append(b);}show(presets[0]);
for(const image of [c.mascot,c.mascotOpen,c.windowGhost,c.boardPhoto,c.boardPhotoErased,c.dollImage,c.dollScary])image.addEventListener('load',()=>c.draw(0));new ResizeObserver(()=>c.draw(0)).observe(c.canvas);
</script></html>
