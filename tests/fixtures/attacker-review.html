<!doctype html><html lang="ko"><meta charset="utf-8"><title>교복 여고생 귀신 등장 검증</title>
<style>body{margin:0;background:#080b0e;color:#d3d4d2;font:15px sans-serif;height:100vh;display:flex;flex-direction:column}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,a{background:#20272b;color:#eee;border:1px solid #617078;padding:10px;cursor:pointer}canvas{width:100%;flex:1;min-height:0}p{margin:0;padding:0 12px 10px;font-size:13px}</style>
<nav><button data-time="0">발견 직후</button><button data-time=".65">공격 표정</button><button data-time="1.1">돌진 마지막</button><button id="reset">다시 숨기기</button><a href="/">게임으로</a></nav>
<p id="status" role="status">사진 로딩 중 · 이 화면은 등장 연출 비교이며 실제 종료 판정은 게임에서 확인합니다.</p>
<canvas id="view" data-renderer="three" aria-label="여고생 귀신 등장 연출"></canvas>
<script type="module">
import {Corridor} from '../../corridor.js?v=rabbit-presence-1';
import {attackerArrival} from '../../schoolgirl-attacker.js?v=rabbit-presence-1';
if(new URLSearchParams(location.search).has('compat')){const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:original.call(this,type,...args);};}
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),c=new Corridor(canvas,()=>{},()=>{});
c.tutorial=false;c.exploration={ended:false};c.enterClassroom('music');c.player={x:0,z:3.93,angle:0,manualLook:true,pitch:0};let time=null;
function render(){
 c.exploration={ended:time!==null};c.caughtAt=time===null?null:performance.now()-time*1000;c.mouthOpen=time!==null&&attackerArrival(time).attack;c.draw(performance.now());
 status.textContent=`${c.attackerImagesReady()?'두 표정 준비됨':'사진 로딩 중'} · ${time===null?'숨김':time===0?'발견 직후':time<1?'공격 표정':'돌진 마지막'} · ${c.use3D?'Three.js':'Canvas 호환 화면'}`;
}
for(const button of document.querySelectorAll('[data-time]'))button.onclick=()=>{time=Number(button.dataset.time);render();};
document.querySelector('#reset').onclick=()=>{time=null;c.view3D?.resetHauntings();render();};
setInterval(render,120);
</script></html>
