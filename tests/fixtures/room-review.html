<!doctype html><html lang="ko"><meta charset="utf-8"><title>교실 외형·돌진 검증</title><style>body{margin:0;background:#132127;color:white;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}nav{padding:12px;flex-shrink:0}button{padding:10px;margin-right:8px}canvas{width:100vw;flex:1;min-height:0;display:block}</style><nav><button data-room="classroom31">3-1 교실</button><button data-room="classroom33">3-3 교실</button><button data-room="classroom">3-2 교실</button><button data-room="music">음악실</button><button data-room="dance">무용실</button><button id="ball-view">창밖 공</button><button id="ghost-close">귀신 가까이</button><button id="ghost-far">귀신 멀리</button><button id="corner-view">구석 그림자</button><button id="doll-side">누운 인형 옆모습</button><button id="neutral">등장 기본 표정</button><button id="teeth">접근 이빨 표정</button><button id="arms">만세 전체 자세</button><button id="catch">돌진 마지막 시점</button><button id="corridor-view">복도 이름표</button></nav><canvas id="view" data-renderer="three" tabindex="0" aria-label="교실 외형 검증"></canvas><script type="module">
import {Corridor} from '../../corridor.js?v=character-original-1';
import {rabbitArrival} from '../../rabbit-arrival.js';
import {ROOM_AMBIENCE} from '../../exploration.js?v=mouse-comfort-1';
import {newCatEvent} from '../../cat-event.js?v=cat-polish-2';
if(new URLSearchParams(location.search).has('compat')){const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:original.call(this,type,...args);};}
if(new URLSearchParams(location.search).has('reduced')){const original=window.matchMedia.bind(window);window.matchMedia=query=>query==='(prefers-reduced-motion: reduce)'?{matches:true}:original(query);}
if(new URLSearchParams(location.search).get('model')==='glb')document.querySelector('canvas').dataset.studentModelPreview='true';
const c=new Corridor(document.querySelector('canvas'),()=>{},()=>{});c.exploration={ended:false};c.tutorial=false;
function room(id){c.reset(null);c.enterClassroom(id);c.exploration={ended:false};if(id==='classroom31')c.player={x:-.7,z:2.8,angle:-Math.PI/2};if(id==='classroom33'||id==='dance')c.player={x:-1.2,z:ROOM_AMBIENCE[id].ghost.z,angle:-Math.PI/2};if(id==='music')c.player={x:0,z:7.35,angle:Math.PI/2};c.draw(performance.now());}
for(const b of document.querySelectorAll('[data-room]'))b.onclick=()=>room(b.dataset.room);
function preview(time){if(c.scene==='corridor')room('music');c.player={x:0,z:3.93,angle:0};c.exploration={ended:true};c.previewTime=time;c.mouthOpen=rabbitArrival(time).teeth;c.caughtAt=performance.now()-time*1000;c.draw(performance.now());}
document.querySelector('#ball-view').onclick=()=>{room('classroom31');c.player={x:-3.7,z:5.25,angle:-Math.PI/2};c.draw(performance.now());};
document.querySelector('#ghost-close').onclick=()=>{room('classroom33');c.player={x:-2.3,z:ROOM_AMBIENCE.classroom33.ghost.z,angle:-Math.PI/2};c.draw(performance.now());};
document.querySelector('#ghost-far').onclick=()=>{room('classroom33');c.player={x:0,z:ROOM_AMBIENCE.classroom33.ghost.z,angle:-Math.PI/2};c.draw(performance.now());};
document.querySelector('#corner-view').onclick=()=>{room('classroom');c.player={x:1.5,z:3.5,angle:2.42};c.draw(performance.now());};
document.querySelector('#doll-side').onclick=()=>{room('classroom');c.player={x:-2.15,z:5.62,angle:Math.PI/2};c.draw(performance.now());};
document.querySelector('#neutral').onclick=()=>preview(.15);
document.querySelector('#teeth').onclick=()=>preview(.65);
document.querySelector('#catch').onclick=()=>preview(1.1);
document.querySelector('#arms').onclick=()=>{preview(.75);c.player.z=1.4;};
document.querySelector('#corridor-view').onclick=()=>{c.reset(null);c.exploration={ended:false};c.player={x:1.8,z:14.8,angle:-Math.PI/2};c.draw(performance.now());};
const musicViews=[['guitar-view','통기타',{x:1.4,z:1.0,angle:.80}],['score-view','악보 정면',{x:-2.4,z:6.5,angle:0}],['score-back','악보 후면',{x:-2.4,z:8.95,angle:Math.PI}]];
for(const [id,label,player] of musicViews){const button=document.createElement('button');button.id=id;button.textContent=label;button.onclick=()=>{room('music');c.player={...player};c.draw(performance.now());};document.querySelector('nav').append(button);}

const dollViews=[
 ['faceless-front','빈 얼굴 학생','classroom33',{x:1.7,z:7.4,angle:.76}],
 ['faceless-near','학생 가까이','classroom33',{x:3.55,z:8.45,angle:0}],
 ['faceless-side','학생 측면','classroom33',{x:2.50,z:9.0,angle:1.24}],
 ['boy-side','아이 측면','music',{x:2.42,z:6.25,angle:0}],
 ['girl-back','여학생 뒷모습','classroom',{x:.65,z:2.9,angle:.365}],
 ['girl-side','여학생 측면','classroom',{x:0,z:4.34,angle:Math.PI/2}],
 ['board-view','칠판 전체','classroom',{x:0,z:5.2,angle:0}],
 ['floor-head','바닥 머리쪽','classroom',{x:-1.05,z:4.4,angle:0}],
 ['floor-right','바닥 오른쪽','classroom',{x:.20,z:5.62,angle:-Math.PI/2}],
 ['floor-feet','바닥 발쪽','classroom',{x:-1.05,z:7.8,angle:Math.PI}],
 ['table-near','책상 인형 근접','classroom31',{x:-1.45,z:3.22,angle:-Math.PI/2}],
 ['table-right','책상 인형 반대쪽','classroom31',{x:-3.65,z:3.22,angle:Math.PI/2}],
 ['bench-near','의자 귀신 근접','music',{x:1.8,z:7.38,angle:Math.PI/2}],
 ['bench-right','의자 귀신 옆쪽','music',{x:1.8,z:8.3,angle:2.2}]
];
for(const [id,label,scene,player] of dollViews){const button=document.createElement('button');button.id=id;button.textContent=label;button.onclick=()=>{room(scene);c.player={...player};c.draw(performance.now());};document.querySelector('nav').append(button);}

for(const [id,label,scene,player] of [
 ['chalk31','3-1 분필 칠판','classroom31',{x:-.2,z:5.2,angle:0}],
 ['chalk32','3-2 분필 칠판','classroom',{x:-.2,z:5.2,angle:0}],
 ['chalk33','3-3 분필 칠판','classroom33',{x:-.2,z:5.2,angle:0}],
 ['chalk-near','당번 글씨 가까이','classroom31',{x:1.86,z:6.5,angle:0}]
]){const button=document.createElement('button');button.id=id;button.textContent=label;button.onclick=()=>{room(scene);c.player={...player};c.draw(performance.now());};document.querySelector('nav').append(button);}

for(const [id,label] of [['cat-side','검은 고양이 옆모습'],['cat-front','검은 고양이 정면'],['cat-room','교실 고양이'],['dance-close','무용실 귀신 가까이']]){
 const button=document.createElement('button');button.id=id;button.textContent=label;
 button.onclick=()=>{
  if(id==='dance-close'){room('dance');c.player={x:-2.3,z:ROOM_AMBIENCE.dance.ghost.z,angle:-Math.PI/2};}
  else{
   id==='cat-room'?room('classroom31'):c.reset(null);c.exploration={ended:false};c.player={x:0,z:1.4,angle:0};
   const path=id==='cat-front'?{from:{x:0,z:6.1},to:{x:0,z:5.1}}:{from:{x:-1.3,z:5.6},to:{x:0,z:5.6}};
   c.catEvent={...newCatEvent(),scene:c.scene,cat:{path,elapsed:.80}};
  }
  c.draw(performance.now());
 };document.querySelector('nav').append(button);
}
for(const [id,label,scene,player] of [
 ['doll-depth','인형 입체 확인','classroom',{x:.2,z:5.72,angle:-Math.PI/2,pitch:-.80,manualLook:true}],
 ['girl-depth','여학생 입체 확인','classroom',{x:.6,z:2.7,angle:.35,pitch:-.35,manualLook:true}],
 ['student-depth','남학생 입체 확인','classroom33',{x:2.35,z:8.1,angle:.75,pitch:-.19,manualLook:true}]
]){const button=document.createElement('button');button.id=id;button.textContent=label;button.onclick=()=>{room(scene);c.player={...player};c.draw(performance.now());};document.querySelector('nav').append(button);}
room('music');setInterval(()=>{if(c.exploration.ended)c.caughtAt=performance.now()-c.previewTime*1000;c.draw(performance.now());},120);
</script></html>
