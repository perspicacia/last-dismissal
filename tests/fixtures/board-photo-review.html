<!doctype html><html lang="ko"><meta charset="utf-8"><title>낡은 게시판 사진 확인</title>
<style>body{margin:0;background:#09130f;color:#d9deca;font:14px sans-serif}nav{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{padding:8px 12px;background:#253b32;color:#e8e4d1;border:1px solid #647361}canvas{width:100%;height:86vh;display:block}#status{margin-left:auto}</style>
<nav><button id="board">게시판 전체</button><button id="close">사진 가까이</button><button id="original">이전 정상 사진</button><button id="erased">이전 지워진 사진</button><a href="?canvas">Canvas 호환 확인</a><a href="../../">게임으로</a><span id="status"></span></nav>
<canvas id="view" data-renderer="three"></canvas><script type="module">
import {Corridor} from '../../corridor.js?v=aged-photo-1';
const view=document.getElementById('view');if(new URLSearchParams(location.search).has('canvas'))view.dataset.renderer='canvas';
const c=new Corridor(view,()=>{},()=>{});c.tutorial=false;c.setActive(false);
function show(mode='aged',close=false){
  c.exploration=mode==='aged'?{ended:false}:null;c.anomaly=mode==='erased'?'board':null;
  c.scene='corridor';c.player={x:close?-1.15:-.6,z:9,angle:-Math.PI/2};c.buildTextures();c.draw(0);
  document.body.dataset.photo=mode;document.getElementById('status').textContent=`${mode==='aged'?'현재 탐색 사진':mode==='erased'?'이전 이상 사진':'이전 정상 사진'} · ${c.use3D?'Three.js':'Canvas'}`;
}
document.getElementById('board').onclick=()=>show();document.getElementById('close').onclick=()=>show('aged',true);
document.getElementById('original').onclick=()=>show('original');document.getElementById('erased').onclick=()=>show('erased');
for(const image of [c.boardPhoto,c.boardPhotoErased])image.addEventListener('load',()=>c.draw(0));
new ResizeObserver(()=>c.draw(0)).observe(c.canvas);show();
</script></html>
