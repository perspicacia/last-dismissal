<!doctype html><html lang="ko"><meta charset="utf-8"><title>계단 렌더링 검증</title><style>body{margin:0;background:#0b1518;color:#dce3d2;font:14px sans-serif}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}canvas{width:100%;height:580px}h2{font-size:16px}</style><main><section><h2>올라가는 계단</h2><canvas id="up" aria-label="상승 계단판과 금속 난간"></canvas></section><section><h2>내려가는 계단</h2><canvas id="down" aria-label="하강 계단판과 금속 난간"></canvas></section><section><h2>비스듬한 계단 입구</h2><canvas id="angled" aria-label="쇠창살 없는 계단 입구와 벽 연결"></canvas></section><section><h2>근거리 위층 · 회전</h2><canvas id="near-up" aria-label="근거리 위층 계단"></canvas></section><section><h2>근거리 아래층 · 회전</h2><canvas id="near-down" aria-label="근거리 아래층 계단"></canvas></section><section><h2>중앙 근거리</h2><canvas id="near-center" aria-label="중앙 근거리 양쪽 계단"></canvas></section></main><script type="module">
import {Corridor} from '../../corridor.js';
for(const id of ['up','down','angled','near-up','near-down','near-center']){const c=new Corridor(document.getElementById(id),()=>{},()=>{});c.player=id==='near-up'?{x:-1.95,z:23.98,angle:-.11}:id==='near-down'?{x:1.6,z:23.75,angle:.25}:id==='near-center'?{x:0,z:23.75,angle:0}:id==='angled'?{x:-.3,z:21.5,angle:.18}:{x:id==='up'?-1.6:1.6,z:22,angle:0};c.tutorial=false;c.buildTextures();c.draw(0);new ResizeObserver(()=>c.draw(0)).observe(c.canvas);}
</script></html>
