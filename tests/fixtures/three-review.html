<!doctype html><html lang="ko"><meta charset="utf-8"><title>3D 학교 검증</title><style>body{margin:0;background:#0b151a;color:#d9e1d5;font:14px sans-serif}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{background:#263c3e;color:#dde8dc;border:1px solid #637a70;padding:8px}canvas{width:100%;height:82vh;display:block}</style><nav id="views"></nav><canvas id="view" data-renderer="three"></canvas><script type="module">
import {Corridor} from '../../corridor.js';
const c=new Corridor(document.getElementById('view'),()=>{},()=>{});c.tutorial=false;
const presets=[['복도',null,'corridor',{x:0,z:1.8,angle:0}],['숲',null,'corridor',{x:1,z:6.5,angle:Math.PI/2}],['창밖 귀신','window','corridor',{x:1,z:6.5,angle:Math.PI/2}],['교실',null,'classroom',{x:0,z:4.9,angle:-Math.PI/2}],['근거리 계단',null,'corridor',{x:-1.6,z:23.6,angle:0}],['아래층',null,'corridor',{x:1.6,z:23.6,angle:0}],['시계',null,'corridor',{x:-.5,z:19,angle:Math.PI/2}],['시계 이상','clock','corridor',{x:-.5,z:19,angle:Math.PI/2}],['문 이상','door','corridor',{x:-.5,z:5,angle:-Math.PI/2}],['사진',null,'corridor',{x:-.3,z:9,angle:-Math.PI/2}],['사진 이상','board','corridor',{x:-.3,z:9,angle:-Math.PI/2}],['토끼 이빨','figure','corridor',{x:1.6,z:13,angle:0}]];
function show(p){c.anomaly=p[1];c.scene=p[2];c.player=p[3];c.mouthOpen=p[0]==='토끼 이빨';c.buildTextures();c.draw(0);document.body.dataset.scene=p[0];}
for(const preset of presets){const b=document.createElement('button');b.textContent=preset[0];b.onclick=()=>show(preset);document.getElementById('views').append(b);}show(presets[0]);
for(const image of [c.mascot,c.mascotOpen,c.windowGhost,c.boardPhoto,c.boardPhotoErased])image.addEventListener('load',()=>c.draw(0));new ResizeObserver(()=>c.draw(0)).observe(c.canvas);
</script></html>
